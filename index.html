<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub 18+ | Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #020617; color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .plus-18 { border: 1.5px solid #ff4d4d; border-radius: 50%; padding: 1px 5px; font-size: 12px; color: #ff4d4d; font-weight: 800; margin-left: 5px; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .movie-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .movie-card:hover { transform: translateY(-8px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* --- NAVIGATION STYLES --- */
        .main-float { position: fixed; bottom: 30px; right: 30px; display: flex; justify-content: center; align-items: center; z-index: 9999; width: 70px; height: 70px; }
        .navigation { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .navigation span { 
            position: absolute; width: 6px; height: 6px; background: #fff; transform: translate(0, 0); 
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), width 0.5s, height 0.5s, background 0.5s;
            transition-delay: calc(0.05s * var(--i)); border-radius: 50%; display: flex; justify-content: center; align-items: center; opacity: 0; 
        }
        .navigation.active span { 
            opacity: 1; width: 60px; height: 60px; background: rgba(30, 41, 59, 0.95); 
            transform: translate(calc(75px * var(--x)), calc(75px * var(--y))); 
            border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); 
        }
        .navigation span ion-icon { font-size: 0em; transition: 0.4s; color: #fff; }
        .navigation.active span ion-icon { font-size: 1.6em; }
        .nav-label { position: absolute; bottom: 6px; font-size: 8px; font-weight: 800; color: #94a3b8; text-transform: uppercase; opacity: 0; transition: 0.3s; }
        .navigation.active span .nav-label { opacity: 1; transition-delay: 0.5s; }
        .close-btn { 
            position: relative; width: 65px; height: 65px; background: rgba(15, 23, 42, 0.95); border: 2px solid rgba(255, 255, 255, 0.15); 
            border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 10; cursor: pointer; 
        }
        .navigation.active ~ .close-btn { background: #3b82f6; transform: rotate(135deg); }
        .close-btn span.menu-text { font-size: 9px; font-weight: 900; color: white; margin-top: 1px; text-transform: uppercase; }
        .navigation.active ~ .close-btn span.menu-text { opacity: 0; }
        .modal-menu { display: none; opacity: 0; transform: scale(0.95); transition: all 0.3s ease; }
        .modal-menu.active { display: flex; opacity: 1; transform: scale(1); }
    </style>
</head>
<body class="pb-20 no-scrollbar">

    <!-- FLOATING NAVIGATION -->
    <div class="main-float">
        <div class="navigation" id="nav-container">
            <span style="--i: 0; --x: 0; --y: -1.35" onclick="loadContent(''); toggleNav();">
                <ion-icon name="home-outline"></ion-icon>
                <div class="nav-label">Home</div>
            </span>
            <span style="--i: 1; --x: -1.25; --y: -1" onclick="loadKDrama('series?order=update&pages=3'); toggleNav();">
                <ion-icon name="tv-outline"></ion-icon>
                <div class="nav-label">K-Drama</div>
            </span>
            <span style="--i: 2; --x: -1.4; --y: 0.2" onclick="openModalMenu('modal-genre'); toggleNav();">
                <ion-icon name="grid-outline"></ion-icon>
                <div class="nav-label">Genre</div>
            </span>
            <span style="--i: 3; --x: 0; --y: -2.6" onclick="openModalMenu('modal-country'); toggleNav();">
                <ion-icon name="earth-outline"></ion-icon>
                <div class="nav-label">Negara</div>
            </span>
            <span style="--i: 4; --x: -1.1; --y: -2.2" onclick="openModalMenu('modal-semi'); toggleNav();">
                <ion-icon name="flame-outline"></ion-icon>
                <div class="nav-label">Semi18+</div>
            </span>
        </div>
        <div class="close-btn" onclick="handleNavClick()">
            <ion-icon name="apps-outline" id="main-nav-icon" style="font-size: 26px; color: white;"></ion-icon>
            <span class="menu-text">MENU</span>
        </div>
    </div>

    <!-- NAVBAR HEADER -->
    <nav class="sticky top-0 z-[100] glass border-b border-white/5 px-4 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black italic tracking-tighter cursor-pointer" onclick="loadContent('')">MOVIEHUB<span class="plus-18">18+</span></h1>
            <div class="flex items-center gap-5">
                <a href="https://t.me/Bleszh" target="_blank" class="text-[#24A1DE] text-2xl hover:scale-110 transition">
                    <i class="fab fa-telegram"></i>
                </a>
                <button onclick="toggleSearch()" class="text-slate-400 hover:text-white transition">
                    <i class="fas fa-search text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- SEARCH BAR -->
    <div id="search-bar" class="hidden container mx-auto px-4 mt-4">
        <div class="relative flex items-center">
            <input type="text" id="query" placeholder="Ketik judul film..." class="w-full bg-slate-900 border border-white/10 rounded-2xl px-6 py-4 focus:outline-none focus:ring-1 focus:ring-blue-500 transition text-white">
            <button onclick="searchMovie()" class="absolute right-4 bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-xs uppercase tracking-widest">Cari</button>
        </div>
    </div>

    <!-- MODAL MENU OVERLAY -->
    <div id="menu-overlay" class="hidden fixed inset-0 z-[9000] bg-black/80 backdrop-blur-sm items-center justify-center p-4">
        <div id="modal-genre" class="modal-menu flex-col w-full max-w-2xl glass border border-white/10 rounded-3xl p-6 relative max-h-[80vh] overflow-y-auto no-scrollbar">
            <button onclick="closeModalMenu()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            <h3 class="text-xs font-black uppercase tracking-widest text-blue-500 mb-6 border-b border-white/10 pb-4">Pilih Genre</h3>
            <div class="grid grid-cols-3 gap-3">
                <script>
                    const gs = ['Action', 'Adventure', 'Animation', 'Comedy', 'Crime', 'Drama', 'Fantasy', 'Family', 'Horror', 'Mystery', 'Romance', 'Sci-Fi', 'Thriller', 'War', 'Western'];
                    document.write(gs.map(g => `<button onclick="loadContent('genre/${g.toLowerCase()}'); closeModalMenu();" class="bg-slate-800/50 hover:bg-blue-600 py-3 rounded-xl text-[10px] font-bold transition uppercase border border-white/5">${g}</button>`).join(''));
                </script>
            </div>
        </div>

        <div id="modal-country" class="modal-menu flex-col w-full max-w-md glass border border-white/10 rounded-3xl p-6 relative">
            <button onclick="closeModalMenu()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            <h3 class="text-xs font-black uppercase tracking-widest text-green-500 mb-6 border-b border-white/10 pb-4">Pilih Negara</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadContent('country/korea'); closeModalMenu();" class="bg-slate-800/50 hover:bg-slate-700 py-3 rounded-xl text-[10px] font-bold uppercase border border-white/5">🇰🇷 Korea</button>
                <button onclick="loadContent('country/japan'); closeModalMenu();" class="bg-slate-800/50 hover:bg-slate-700 py-3 rounded-xl text-[10px] font-bold uppercase border border-white/5">🇯🇵 Japan</button>
                <button onclick="loadContent('country/thailand'); closeModalMenu();" class="bg-slate-800/50 hover:bg-slate-700 py-3 rounded-xl text-[10px] font-bold uppercase border border-white/5">🇹🇭 Thailand</button>
                <button onclick="loadContent('country/hong-kong'); closeModalMenu();" class="bg-slate-800/50 hover:bg-slate-700 py-3 rounded-xl text-[10px] font-bold uppercase border border-white/5">🇭🇰 Hong Kong</button>
            </div>
        </div>

        <div id="modal-semi" class="modal-menu flex-col w-full max-w-md glass border border-red-500/20 rounded-3xl p-6 relative">
            <button onclick="closeModalMenu()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            <h3 class="text-xs font-black uppercase tracking-widest text-red-500 mb-6 border-b border-white/10 pb-4">Film Semi 18+</h3>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="loadContent('semi-jepang'); closeModalMenu();" class="bg-red-950/30 hover:bg-red-900/50 py-3 rounded-xl text-[10px] font-bold uppercase border border-red-500/20">🇯🇵 Semi Jepang</button>
                <button onclick="loadContent('semi-korea'); closeModalMenu();" class="bg-red-950/30 hover:bg-red-900/50 py-3 rounded-xl text-[10px] font-bold uppercase border border-red-500/20">🇰🇷 Semi Korea</button>
                <button onclick="loadContent('semi-philippines'); closeModalMenu();" class="bg-red-950/30 hover:bg-red-900/50 py-3 rounded-xl text-[10px] font-bold uppercase border border-red-500/20">🇵🇭 Semi Philippines</button>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="container mx-auto px-4 mt-8">
        <h2 id="section-title" class="text-xs font-black uppercase tracking-[0.4em] text-slate-500 mb-8 flex items-center gap-3">
            <span class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-pulse"></span> TERBARU
        </h2>
        <div id="movie-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
    </main>

    <!-- PLAYER MODAL -->
    <div id="player-modal" class="hidden fixed inset-0 z-[1000] bg-[#020617]/98 backdrop-blur-xl flex flex-col items-center justify-center p-4">
        <button onclick="closePlayer()" class="absolute top-6 right-6 w-12 h-12 flex items-center justify-center bg-white/5 hover:bg-red-600 rounded-full text-white transition-all duration-300">
            <i class="fas fa-times text-2xl"></i>
        </button>
        <div class="w-full max-w-5xl flex flex-col gap-8">
            <div class="relative w-full aspect-video bg-black rounded-[2.5rem] overflow-hidden border border-white/5 shadow-2xl">
                <iframe id="main-player" src="" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="text-center space-y-4">
                <h3 id="player-title" class="text-lg md:text-2xl font-black text-white italic tracking-tight uppercase line-clamp-2 px-6"></h3>
                <div id="episode-area" class="hidden space-y-4">
                    <div id="episode-list" class="flex flex-wrap justify-center gap-2 max-h-32 overflow-y-auto no-scrollbar px-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://apil-fy3l.vercel.app";
        const API_KDRAMA = "https://l2api.vercel.app";

        function handleNavClick() {
            const nav = document.getElementById('nav-container');
            const icon = document.getElementById('main-nav-icon');
            nav.classList.toggle('active');
            icon.setAttribute('name', nav.classList.contains('active') ? 'close-outline' : 'apps-outline');
        }

        function toggleNav() {
            document.getElementById('nav-container').classList.remove('active');
            document.getElementById('main-nav-icon').setAttribute('name', 'apps-outline');
        }

        function openModalMenu(id) {
            const overlay = document.getElementById('menu-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex'); // PERBAIKAN DI SINI
            document.querySelectorAll('.modal-menu').forEach(m => m.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function closeModalMenu() { 
            const overlay = document.getElementById('menu-overlay');
            overlay.classList.add('hidden'); 
            overlay.classList.remove('flex'); 
        }

        async function loadContent(endpoint = "") {
            const container = document.getElementById('movie-container');
            const title = document.getElementById('section-title');
            container.innerHTML = `<div class="col-span-full py-40 text-center"><div class="inline-block w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div></div>`;
            title.innerHTML = `<span class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-pulse"></span> ${endpoint ? endpoint.split('/').pop().toUpperCase() : 'TERBARU'}`;

            try {
                const res = await fetch(`${API_BASE}/${endpoint}`);
                const json = await res.json();
                renderMovies(json.data, false);
            } catch (e) { console.error(e); }
        }

        async function loadKDrama(path) {
            const container = document.getElementById('movie-container');
            container.innerHTML = `<div class="col-span-full py-40 text-center"><div class="inline-block w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>`;
            try {
                const res = await fetch(`${API_KDRAMA}/${path}`);
                const json = await res.json();
                renderMovies(json.data, true);
            } catch (e) { console.error(e); }
        }

        function renderMovies(data, isKDrama) {
            const container = document.getElementById('movie-container');
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 opacity-50">KOSONG BOSKU</div>`;
                return;
            }
            container.innerHTML = data.map(m => `
                <div class="movie-card group cursor-pointer" onclick="${isKDrama ? `playKDrama('${m.link}')` : `playMovie('${m.link}', '${m.title.replace(/'/g, "\\'")}')`}">
                    <div class="relative aspect-[2/3] rounded-[2.5rem] overflow-hidden bg-slate-900 border border-white/5 shadow-2xl">
                        <img src="${m.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent opacity-90"></div>
                        <div class="absolute bottom-6 left-6 right-6">
                            <p class="text-[10px] font-black leading-tight line-clamp-2 uppercase tracking-tighter text-white">${m.title}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function playMovie(link, title) {
            document.getElementById('player-modal').classList.remove('hidden');
            document.getElementById('episode-area').classList.add('hidden');
            document.getElementById('player-title').innerText = "MEMUAT...";
            const res = await fetch(`${API_BASE}/detail?url=${encodeURIComponent(link)}`);
            const json = await res.json();
            document.getElementById('main-player').src = json.streams[0];
            document.getElementById('player-title').innerText = title;
        }

        async function playKDrama(link) {
            document.getElementById('player-modal').classList.remove('hidden');
            document.getElementById('episode-area').classList.remove('hidden');
            const res = await fetch(`${API_KDRAMA}/detail?url=${encodeURIComponent(link)}`);
            const json = await res.json();
            document.getElementById('main-player').src = json.streams[0];
            document.getElementById('player-title').innerText = json.title;
            document.getElementById('episode-list').innerHTML = json.episodes.map(ep => `
                <button onclick="changeEpsKDrama('${ep.link}')" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-[10px] font-black">Eps ${ep.eps}</button>
            `).join('');
        }

        async function changeEpsKDrama(link) {
            document.getElementById('player-title').innerText = "MEMUAT EPISODE...";
            const res = await fetch(`${API_KDRAMA}/detail?url=${encodeURIComponent(link)}`);
            const json = await res.json();
            document.getElementById('main-player').src = json.streams[0];
            document.getElementById('player-title').innerText = json.title;
        }

        function closePlayer() {
            document.getElementById('player-modal').classList.add('hidden');
            document.getElementById('main-player').src = "";
        }

        function toggleSearch() { document.getElementById('search-bar').classList.toggle('hidden'); }
        async function searchMovie() {
            const q = document.getElementById('query').value;
            if (q) { loadContent(`search?q=${q}`); toggleSearch(); }
        }
        window.onload = () => loadContent('');
    </script>
</body>
</html>
